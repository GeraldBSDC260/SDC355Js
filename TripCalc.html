<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gerbla7878, Trip Stats Calculator</title>

<script>
function generateTripSummary() {

// Collect input values
let tripName = document.getElementById("tripName").value;
let startingMileage = parseFloat(document.getElementById("startMileage").value);
let endingMileage = parseFloat(document.getElementById("endMileage").value);
let gallonsUsed = parseFloat(document.getElementById("gallonsUsed").value);

// Calculate values
let totalMiles = endingMileage - startingMileage;
let mpg = totalMiles / gallonsUsed;

// Create trip object
let tripSummary = {
tripName: tripName,
startingMileage: startingMileage,
endingMileage: endingMileage,
gallonsUsed: gallonsUsed,
totalMiles: totalMiles,
mpg: mpg.toFixed(1)
};

// Save date/time to session storage
let currentDate = new Date();
sessionStorage.setItem("tripDateTime", currentDate);

// Save object to cookie
document.cookie = "tripSummary=" + 
encodeURIComponent(JSON.stringify(tripSummary)) +
"; path=/";

// Open new window for summary
let summaryWindow = window.open("", "_blank");

summaryWindow.document.write(`
<html>
<head>
<title>Gerbla7878, Trip Summary</title>
</head>
<body>
<h1>Gerbla7878, Trip Summary</h1>
<p><strong>Trip Name:</strong> ${tripSummary.tripName}</p>
<p><strong>Total Miles Traveled:</strong> ${tripSummary.totalMiles}</p>
<p><strong>Gallons of Gas Consumed:</strong> ${tripSummary.gallonsUsed}</p>
<p><strong>Fuel Economy (MPG) for Trip:</strong> ${tripSummary.mpg}</p>
<p><strong>Summary Generated On:</strong> ${currentDate}</p>
</body>
</html>
`);

summaryWindow.document.close();
}
</script>
</head>

<body>

<h1>Gerbla7878, Trip Stats Calculator</h1>

<label for="tripName">Trip Name:</label>
<input type="text" id="tripName"><br><br>

<label for="startMileage">Starting Mileage:</label>
<input type="text" id="startMileage"><br><br>

<label for="endMileage">Ending Mileage:</label>
<input type="text" id="endMileage"><br><br>

<label for="gallonsUsed">Gallons of Gas Used:</label>
<input type="text" id="gallonsUsed"><br><br>

<button onclick="generateTripSummary()">Get Trip Summary</button>

</body>
</html>
